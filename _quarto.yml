      - icon: linkedin
        href: https://www.linkedin.com/in/hannah-lyons-l8/
      - text: "Built with Quarto"
        href: https://quarto.org
  navbar:
    right:
      - text: Blog
        href: blog.qmd
      - text: About
        href: index.qmd
      - text: Archive
        href: archive.qmd
      - icon: linkedin
        href: https://www.linkedin.com/in/hannah-lyons-l8/
      - icon: github
        href: https://github.com/hannahl8
format:
  html:
    theme:
      light: theme-light.scss
      dark: theme-dark.scss
    respect-user-color-scheme: true
    css: styles.css
    include-after-body: footer-year.html

