    type: express
    style: simple
    palette: dark
  google-analytics:
    tracking-id: "G-BMHFVF8XE9"
    anonymize-ip: true
    storage: cookies
  title: "Hannah Lyons"
  site-url: https://hannahl8.github.io/
  description: "Hannah Lyons is a software engineer building full-stack web and desktop applications. Projects, notes, and career timeline."
  image: headshot-480.jpg
  open-graph: true
  twitter-card: true
  repo-url: https://github.com/hannahl8/hannahl8.github.io
  repo-actions: [source]
  page-footer:
    left: "© <span class='copyright-year'>2026</span> Hannah Lyons"
    right:
      - icon: github
